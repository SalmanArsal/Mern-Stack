<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sec{
            background-color: red;
            height: 50vh;
            width: 50vw;
            position: relative;

            .box{
                height: 50px;
                width: 50px;
                background-color: black;
                position: absolute;
                bottom: 0px;
                right: 0px;
            }

            .box:hover{
                background-color: aqua;
            }
        }

        input::placeholder{
            color: red;
        }
    </style>
</head>
<body>
    <div class="sec">
        <div class="box"></div>
    </div>


    <input type="text" placeholder="enter your name">
</body>
</html>
